<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления CheckBot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight">CheckBot Admin</h1>
                    <p class="text-xs text-slate-400">AI-верификация комментариев TikTok и управление доступом</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Бот активен
                </span>
                <button onclick="fetchData()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="Обновить">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-slate-400">Всего пользователей</span>
                    <span class="p-2 bg-indigo-500/10 rounded-xl text-indigo-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    </span>
                </div>
                <p class="text-3xl font-bold text-white mt-3" id="stat-total">0</p>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-emerald-400">Одобрено (в канале)</span>
                    <span class="p-2 bg-emerald-500/10 rounded-xl text-emerald-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </span>
                </div>
                <p class="text-3xl font-bold text-emerald-400 mt-3" id="stat-verified">0</p>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-rose-400">Отклонено AI</span>
                    <span class="p-2 bg-rose-500/10 rounded-xl text-rose-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </span>
                </div>
                <p class="text-3xl font-bold text-rose-400 mt-3" id="stat-rejected">0</p>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-sky-400">Всего AI-проверок</span>
                    <span class="p-2 bg-sky-500/10 rounded-xl text-sky-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </span>
                </div>
                <p class="text-3xl font-bold text-sky-400 mt-3" id="stat-attempts">0</p>
            </div>
        </div>

        <!-- Controls: Filters & Search -->
        <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-2">
                <button onclick="setStatusFilter('')" id="filter-all" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white transition">Все</button>
                <button onclick="setStatusFilter('verified')" id="filter-verified" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Одобренные</button>
                <button onclick="setStatusFilter('rejected')" id="filter-rejected" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Отклоненные</button>
                <button onclick="setStatusFilter('pending')" id="filter-pending" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">В процессе</button>
            </div>

            <div class="relative w-full md:w-80">
                <input type="text" id="search-input" placeholder="Поиск по ID или username..." 
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                       onkeyup="debounceSearch()">
                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
        </div>

        <!-- Users Table -->
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700/60">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Пользователь</th>
                            <th class="px-6 py-4 font-semibold">Статус</th>
                            <th class="px-6 py-4 font-semibold">Попытки</th>
                            <th class="px-6 py-4 font-semibold">Ссылка / Причина</th>
                            <th class="px-6 py-4 font-semibold">Дата</th>
                            <th class="px-6 py-4 font-semibold text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody" class="divide-y divide-slate-700/40">
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-slate-500">Загрузка данных...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="px-6 py-4 bg-slate-900/40 border-t border-slate-700/40 flex items-center justify-between text-xs text-slate-400">
                <span id="page-info">Показано 0 из 0</span>
                <div class="flex space-x-2">
                    <button id="prev-btn" onclick="prevPage()" disabled class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 disabled:opacity-40 hover:bg-slate-700 transition">Назад</button>
                    <button id="next-btn" onclick="nextPage()" disabled class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 disabled:opacity-40 hover:bg-slate-700 transition">Вперед</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for User Logs -->
    <div id="logs-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-white text-base" id="modal-title">История проверок</h3>
                    <p class="text-xs text-slate-400" id="modal-subtitle">User ID</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1" id="modal-content">
                <!-- Logs injected here -->
            </div>
        </div>
    </div>

    <script>
        let currentStatus = '';
        let searchQuery = '';
        let offset = 0;
        const limit = 20;
        let searchTimeout = null;

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('stat-total').innerText = data.total_users;
                document.getElementById('stat-verified').innerText = data.verified_users;
                document.getElementById('stat-rejected').innerText = data.rejected_users;
                document.getElementById('stat-attempts').innerText = data.total_attempts;
            } catch (err) {
                console.error("Ошибка получения статистики:", err);
            }
        }

        async function fetchUsers() {
            try {
                const params = new URLSearchParams({
                    search: searchQuery,
                    status: currentStatus,
                    limit: limit,
                    offset: offset
                });
                const res = await fetch(`/api/users?${params.toString()}`);
                const result = await res.json();

                renderUsers(result.users);
                renderPagination(result.total, result.users.length);
            } catch (err) {
                console.error("Ошибка загрузки пользователей:", err);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-tbody');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-500">Пользователи не найдены</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(u => {
                let statusBadge = '';
                if (u.status === 'verified') {
                    statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Одобрен</span>`;
                } else if (u.status === 'rejected') {
                    statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20">Отклонен</span>`;
                } else {
                    statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">Ожидание</span>`;
                }

                const username = u.username ? `<a href="https://t.me/${u.username}" target="_blank" class="text-indigo-400 hover:underline">@${u.username}</a>` : '<span class="text-slate-500">Без юзернейма</span>';
                const name = `${u.first_name || ''} ${u.last_name || ''}`.trim() || 'Пользователь';

                let infoCol = '-';
                if (u.status === 'verified' && u.invite_link) {
                    infoCol = `
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-mono text-slate-300 truncate max-w-[200px]">${u.invite_link}</span>
                            <button onclick="copyLink('${u.invite_link}')" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-700" title="Скопировать">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            </button>
                        </div>
                    `;
                } else if (u.rejection_reason) {
                    infoCol = `<span class="text-xs text-rose-300 line-clamp-1" title="${u.rejection_reason.replace(/"/g, '&quot;')}">${u.rejection_reason}</span>`;
                }

                const dateStr = u.updated_at ? new Date(u.updated_at).toLocaleString('ru-RU') : '-';

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="px-6 py-4">
                            <div class="font-medium text-white">${name}</div>
                            <div class="text-xs text-slate-400 flex items-center space-x-2">
                                <span>${username}</span>
                                <span>•</span>
                                <span class="font-mono">ID: ${u.user_id}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">${statusBadge}</td>
                        <td class="px-6 py-4 font-mono text-xs">${u.attempts_count || 0}</td>
                        <td class="px-6 py-4">${infoCol}</td>
                        <td class="px-6 py-4 text-xs text-slate-400">${dateStr}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="openUserLogs(${u.user_id}, '${name}')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition">
                                Логи AI
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPagination(total, currentCount) {
            const start = total > 0 ? offset + 1 : 0;
            const end = offset + currentCount;
            document.getElementById('page-info').innerText = `Показано ${start}–${end} из ${total}`;
            document.getElementById('prev-btn').disabled = offset <= 0;
            document.getElementById('next-btn').disabled = end >= total;
        }

        function prevPage() {
            if (offset >= limit) {
                offset -= limit;
                fetchUsers();
            }
        }

        function nextPage() {
            offset += limit;
            fetchUsers();
        }

        function setStatusFilter(status) {
            currentStatus = status;
            offset = 0;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            });

            const activeId = status === '' ? 'filter-all' : `filter-${status}`;
            const activeBtn = document.getElementById(activeId);
            if (activeBtn) {
                activeBtn.className = 'filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white transition';
            }

            fetchUsers();
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = document.getElementById('search-input').value.trim();
                offset = 0;
                fetchUsers();
            }, 300);
        }

        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                alert("Ссылка скопирована в буфер обмена!");
            });
        }

        async function openUserLogs(userId, name) {
            document.getElementById('modal-title').innerText = `Логи проверок: ${name}`;
            document.getElementById('modal-subtitle').innerText = `Telegram ID: ${userId}`;
            const content = document.getElementById('modal-content');
            content.innerHTML = `<div class="text-center text-slate-400 py-6">Загрузка логов...</div>`;
            document.getElementById('logs-modal').classList.remove('hidden');

            try {
                const res = await fetch(`/api/users/${userId}/logs`);
                const logs = await res.json();

                if (!logs || logs.length === 0) {
                    content.innerHTML = `<div class="text-center text-slate-400 py-6">Для этого пользователя пока нет записей о проверках.</div>`;
                    return;
                }

                content.innerHTML = logs.map(l => {
                    const isAppr = l.approved === 1;
                    const badge = isAppr 
                        ? `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/20 text-emerald-400">ОДОБРЕНО</span>`
                        : `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-rose-500/20 text-rose-400">ОТКЛОНЕНО</span>`;
                    const date = new Date(l.created_at).toLocaleString('ru-RU');

                    return `
                        <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-4">
                            <div class="flex items-center justify-between mb-2">
                                ${badge}
                                <span class="text-xs text-slate-500 font-mono">${date}</span>
                            </div>
                            <p class="text-sm text-slate-300 whitespace-pre-wrap">${l.reason || 'Без описания'}</p>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                content.innerHTML = `<div class="text-rose-400 text-center py-6">Ошибка загрузки логов</div>`;
            }
        }

        function closeModal() {
            document.getElementById('logs-modal').classList.add('hidden');
        }

        function fetchData() {
            fetchStats();
            fetchUsers();
        }

        // Init on page load
        fetchData();
        setInterval(fetchStats, 15000); // Автообновление статистики раз в 15 сек
    </script>
</body>
</html>
